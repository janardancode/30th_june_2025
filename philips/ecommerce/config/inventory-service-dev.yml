server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/philipsecommerce
    username: root
    password: test

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# ---------------- Resilience4j ----------------
resilience4j:

  circuitbreaker:
    instances:
      inventoryService:
        failure-rate-threshold: 50
        sliding-window-size: 5
        minimum-number-of-calls: 3
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2

  retry:
    instances:
      inventoryService:
        max-attempts: 3
        wait-duration: 2s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
